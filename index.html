<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ilha dos Dragões</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#02020c;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#ddd;overflow:hidden}
.sky{position:fixed;inset:0;z-index:-5;background:linear-gradient(#01010a,#06061a 40%,#0a1520)}
.stars{position:fixed;inset:0;z-index:-4;background-image:radial-gradient(1px 1px at 50px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 150px 80px,#fff,transparent),radial-gradient(1px 1px at 280px 20px,#fff,transparent),radial-gradient(1px 1px at 400px 90px,#fff,transparent),radial-gradient(1.5px 1.5px at 550px 50px,#fff,transparent),radial-gradient(1px 1px at 700px 30px,#fff,transparent),radial-gradient(1px 1px at 850px 70px,#fff,transparent);background-size:950px 120px;animation:t 5s ease-in-out infinite alternate}
@keyframes t{from{opacity:.4}to{opacity:1}}
.moon{position:fixed;top:30px;right:60px;width:70px;height:70px;background:radial-gradient(circle at 30% 30%,#faf0c8,#e0d090);border-radius:50%;box-shadow:0 0 40px 12px rgba(255,240,160,.25);z-index:-3}
h1{font-size:1.5rem;letter-spacing:2px;text-shadow:0 0 20px rgba(80,140,255,.5);margin-bottom:4px}
.sub{font-size:.8rem;opacity:.5;margin-bottom:10px}
#g{position:relative;width:min(900px,96vw);height:460px;overflow:hidden;border-radius:14px;border:2px solid rgba(40,90,60,.4);box-shadow:0 0 40px rgba(0,30,15,.5);background:linear-gradient(to bottom,transparent 30%,#061510 70%,#0a1c14)}
.water{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(to bottom,rgba(10,50,70,.3),rgba(5,40,60,.8));z-index:1}
.water::before{content:'';position:absolute;left:-50%;right:-50%;top:0;height:20px;background:repeating-linear-gradient(90deg,transparent,transparent 30px,rgba(80,180,200,.12) 30px,rgba(80,180,200,.12) 60px);animation:w 4s linear infinite}
@keyframes w{from{transform:translateX(0)}to{transform:translateX(60px)}}
.island{position:absolute;bottom:70px;left:50%;width:700px;height:100px;margin-left:-350px;background:linear-gradient(#1a4030,#0e2818);border-radius:50% 50% 0 0;z-index:2}
.hero{position:absolute;bottom:95px;left:80px;width:36px;height:55px;z-index:10;transition:left .07s linear}
.h-head{width:20px;height:20px;background:#e8c8a0;border-radius:50%;margin:0 auto;border:2px solid #2a4a6a;position:relative}
.h-head::before{content:'';position:absolute;top:5px;left:3px;width:4px;height:4px;background:#1a1a2a;border-radius:50%;box-shadow:9px 0 0 #1a1a2a}
.h-body{width:26px;height:30px;background:linear-gradient(#3a5a8a,#2a4a6a);border-radius:5px;margin:0 auto;position:relative;box-shadow:0 0 10px rgba(60,100,180,.4)}
.sword{position:absolute;right:-16px;top:12px;width:5px;height:30px;background:linear-gradient(#c0c0d0,#808090);border-radius:2px;transform-origin:bottom;transition:transform .15s}
.sword::before{content:'';position:absolute;top:-3px;left:-3px;width:11px;height:7px;background:#a09050;border-radius:2px}
.hero.atk .sword{transform:rotate(-50deg)}
.dragon{position:absolute;bottom:100px;width:65px;height:45px;z-index:8}
.d-body{width:48px;height:26px;background:linear-gradient(135deg,#4a1a1a,#2a0a0a);border-radius:40% 60% 50% 40%;margin:0 auto;position:relative;box-shadow:0 0 12px rgba(180,40,20,.3)}
.d-head{position:absolute;right:-16px;top:-6px;width:26px;height:22px;background:linear-gradient(90deg,#5a2020,#3a1010);border-radius:40% 60% 50% 40%}
.d-eye{position:absolute;top:5px;right:5px;width:6px;height:6px;background:#ff4040;border-radius:50%;box-shadow:0 0 8px #ff2020}
.d-wing{position:absolute;left:6px;top:-16px;width:0;height:0;border-left:20px solid transparent;border-right:6px solid transparent;border-bottom:26px solid #3a1515;transform-origin:bottom left;animation:f .55s ease-in-out infinite alternate}
@keyframes f{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
.d-tail{position:absolute;left:-14px;top:9px;width:18px;height:7px;background:#3a1515;border-radius:0 50% 50% 0;transform:rotate(-18deg)}
.dragon.hurt{filter:brightness(1.8)}
.fire{position:absolute;width:16px;height:16px;background:radial-gradient(circle,#ffcc00,#ff4400 60%,transparent);border-radius:50%;box-shadow:0 0 10px #ff6600;z-index:9}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:20;pointer-events:none}
.box{background:rgba(0,10,5,.8);border:1px solid rgba(60,120,80,.4);border-radius:8px;padding:5px 12px;font-size:.9rem}
.hp-bar{display:inline-block;width:100px;height:10px;background:#1a0a0a;border-radius:5px;overflow:hidden;vertical-align:middle;margin:0 6px;border:1px solid #402020}
.hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#c03030,#e06040);transition:width .3s}
.msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,8,5,.95);border:2px solid rgba(60,140,90,.5);border-radius:14px;padding:24px 36px;text-align:center;z-index:30;display:none}
.msg h2{font-size:1.5rem;margin-bottom:10px;color:#70d090}
.msg p{opacity:.8;margin-bottom:14px;line-height:1.4}
.btn{background:linear-gradient(#2a6a4a,#1a4a30);border:1px solid #3a8a5a;color:#e0ffe0;padding:10px 26px;border-radius:8px;font-size:1rem;cursor:pointer}
.btn:hover{background:linear-gradient(#3a8a5a,#2a6a4a)}
.ctrl{display:flex;gap:12px;margin-top:12px}
.cbtn{width:64px;height:48px;background:rgba(10,30,20,.85);border:1px solid rgba(50,110,70,.45);border-radius:10px;color:#90c0a0;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:active{background:rgba(30,70,45,.9)}
.cbtn.atk{width:84px;background:rgba(50,18,15,.85);border-color:rgba(150,50,35,.5);color:#f0a080}
.hint{margin-top:8px;font-size:.75rem;opacity:.45}
.wave-l{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:1.1rem;opacity:0;transition:opacity .4s;z-index:15;text-shadow:0 0 10px rgba(80,200,140,.5)}
</style>
</head>
<body>
<div class="sky"></div><div class="stars"></div><div class="moon"></div>
<h1>🐉 Ilha dos Dragões</h1>
<p class="sub">Derrote os dragões!</p>
<div id="g">
<div class="water"></div>
<div class="island"></div>
<div class="hud">
<div class="box">❤️ <div class="hp-bar"><div class="hp-fill" id="hp"></div></div> <span id="hn">100</span></div>
<div class="box">⚔️ <span id="k">0</span> | 🌊 <span id="w">1</span></div>
</div>
<div class="wave-l" id="wl">Onda 1</div>
<div class="hero" id="hero"><div class="h-head"></div><div class="h-body"><div class="sword"></div></div></div>
<div class="msg" id="start"><h2>Ilha dos Dragões</h2><p>← → ou A D para mover<br>Espaço ou Clique para atacar<br>Sobreviva às 6 ondas!</p><button class="btn" onclick="start()">Começar</button></div>
<div class="msg" id="over"><h2>Você caiu...</h2><p>Kills: <span id="fk">0</span> | Onda: <span id="fw">1</span></p><button class="btn" onclick="start()">Tentar de novo</button></div>
<div class="msg" id="win"><h2>Vitória!</h2><p>Você limpou a ilha!<br>Kills: <span id="wk">0</span></p><button class="btn" onclick="start()">Jogar de novo</button></div>
</div>
<div class="ctrl">
<button class="cbtn" id="bl">◀</button>
<button class="cbtn atk" id="ba">⚔️</button>
<button class="cbtn" id="br">▶</button>
</div>
<p class="hint">← → mover · Espaço atacar</p>
<script>
const g=document.getElementById('g'),he=document.getElementById('hero'),hpEl=document.getElementById('hp'),hn=document.getElementById('hn'),kEl=document.getElementById('k'),wEl=document.getElementById('w'),wl=document.getElementById('wl');
let hero={x:80,hp:100,atk:false,inv:0},drags=[],fires=[],keys={},kills=0,wave=1,run=false,last=0,spT=0,spn=0,toSp=3;
const MAX=6,W=()=>g.offsetWidth;
function start(){['start','over','win'].forEach(i=>document.getElementById(i).style.display='none');document.querySelectorAll('.dragon,.fire').forEach(e=>e.remove());drags=[];fires=[];hero={x:80,hp:100,atk:false,inv:0};kills=0;wave=1;spn=0;toSp=3;spT=1.4;run=true;last=performance.now();hud();showW();requestAnimationFrame(loop)}
function hud(){hpEl.style.width=Math.max(0,hero.hp)+'%';hn.textContent=Math.max(0,Math.ceil(hero.hp));kEl.textContent=kills;wEl.textContent=wave}
function showW(){wl.textContent='Onda '+wave;wl.style.opacity='1';setTimeout(()=>wl.style.opacity='0',1600)}
function spawn(){const el=document.createElement('div');el.className='dragon';const fr=Math.random()>.35;let x=fr?W()+20:-70;el.style.left=x+'px';el.innerHTML='<div class="d-wing"></div><div class="d-body"><div class="d-tail"></div><div class="d-head"><div class="d-eye"></div></div></div>';g.appendChild(el);const sp=.8+wave*.25+Math.random()*.4;drags.push({el,x,hp:2+Math.floor(wave/2),sp:fr?-sp:sp,fc:1.5+Math.random()*1.5});spn++}
function attack(){if(!run||hero.atk)return;hero.atk=true;he.classList.add('atk');const ax=hero.x+28;drags.forEach(d=>{if(d.hp<=0)return;if(Math.abs((d.x+32)-ax)<50){d.hp--;d.el.classList.add('hurt');setTimeout(()=>d.el.classList.remove('hurt'),180);if(d.hp<=0){kills++;d.el.remove();drags=drags.filter(x=>x!==d);hud()}}});setTimeout(()=>{hero.atk=false;he.classList.remove('atk')},200)}
function sFire(d){const el=document.createElement('div');el.className='fire';el.style.left=(d.x+18)+'px';el.style.bottom='125px';g.appendChild(el);const dir=d.sp>0?1:-1;fires.push({el,x:d.x+18,sp:dir*(2.2+wave*.3)})}
function die(){run=false;document.getElementById('fk').textContent=kills;document.getElementById('fw').textContent=wave;document.getElementById('over').style.display='block'}
function win(){run=false;document.getElementById('wk').textContent=kills;document.getElementById('win').style.display='block'}
function loop(now){if(!run)return;const dt=Math.min((now-last)/1000,.05);last=now;let dx=0;if(keys.ArrowLeft||keys.a||keys.A)dx-=1;if(keys.ArrowRight||keys.d||keys.D)dx+=1;hero.x+=dx*220*dt;hero.x=Math.max(10,Math.min(W()-50,hero.x));he.style.left=hero.x+'px';if(hero.inv>0)hero.inv-=dt;if(spn<toSp){spT-=dt;if(spT<=0){spawn();spT=1.2+Math.random()*1.4-wave*.08}}else if(drags.length===0){if(wave>=MAX){win();return}wave++;spn=0;toSp=3+wave;spT=1.8;showW();hud()}drags.forEach(d=>{d.x+=d.sp*58*dt;d.el.style.left=d.x+'px';if(d.x<-90||d.x>W()+50)d.sp*=-1;d.fc-=dt;if(d.fc<=0){sFire(d);d.fc=2.1+Math.random()*1.8-wave*.1}if(hero.inv<=0&&Math.abs((d.x+32)-(hero.x+18))<38){hero.hp-=11+wave*1.8;hero.inv=.85;hud();if(hero.hp<=0)die()}});for(let i=fires.length-1;i>=0;i--){const f=fires[i];f.x+=f.sp*58*dt;f.el.style.left=f.x+'px';if(f.x<-25||f.x>W()+25){f.el.remove();fires.splice(i,1);continue}if(hero.inv<=0&&Math.abs((f.x+8)-(hero.x+18))<26){hero.hp-=7+wave;hero.inv=.65;f.el.remove();fires.splice(i,1);hud();if(hero.hp<=0)die()}}requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.code==='Space'){e.preventDefault();attack()}});
window.addEventListener('keyup',e=>keys[e.key]=false);
g.addEventListener('click',()=>{if(run)attack()});
function hold(k,b){['touchstart','mousedown'].forEach(e=>b.addEventListener(e,ev=>{ev.preventDefault();keys[k]=true}));['touchend','mouseup','mouseleave'].forEach(e=>b.addEventListener(e,()=>keys[k]=false))}
hold('ArrowLeft',document.getElementById('bl'));
hold('ArrowRight',document.getElementById('br'));
document.getElementById('ba').addEventListener('click',attack);
document.getElementById('start').style.display='block';
</script>
</body>
</html>
